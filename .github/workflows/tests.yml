name: tests

# 每次 push 和每个 PR 都跑一遍。测试全部离线 —— 不需要凭据、不碰网络、
# 不连券商，所以 CI 里跑的和你在本机跑的是同一件事。
on:
  push:
  pull_request:

# 只读即可：这个 workflow 不写任何东西回仓库。
permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # 3.10 是声明的下限，单独在 Linux 上验一次就够；
          # Windows 上跑中间与最新版，省一半 CI 时间。
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 这里刻意不 `pip install .` —— 本 job 验的是「clone 下来直接跑」：
      # pyproject.toml 里的 pythonpath=["."] 已经让 `python -m pytest` 在仓库根可用。
      # 只装运行时依赖 + pytest。
      # ★ 「装成包之后还能不能跑」由下面那个独立的 `installed` job 负责 ——
      #   两件事必须分开，因为在仓库根跑会**盖住**装包才暴露的问题。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pytest

      # ★ 步骤名里**不写测试条数** —— 手写的数字会随代码漂移，而这里写错了
      # 没人会红（步骤名不参与断言）。条数以实测为准，README「跑测试」一节
      # 也只把它当参考值。
      - name: 跑测试（全离线，不需要任何凭据）
        run: python -m pytest

      # 脱敏扫描也进 CI：本地那个 pre-commit 钩子靠 core.hooksPath，
      # 而那是本机配置、不随 clone 带走 —— 也就是说**别人克隆下来默认是不设防的**。
      # 这里补一道服务端的。
      # ★ 注意：CI 里两份自备清单都没有（.sanitize-deny.txt 与 .sanitize-markers.txt
      # 都被 gitignore 挡住，刻意不入库），所以扫描器会自行降级并明确打印
      # 「⚠️ …（**不完整**）」。**这是预期行为，不是失败** —— 而且反过来成立：
      # 这里若打出绿勾 ✅，说明有人把私有清单提交上去了，那才是问题。
      # 真正的「完整通过」只可能在本机跑出来。
      - name: 脱敏扫描（零凭据）
        run: python tools/sanitize_check.py --all

  # ============================================================
  # 把包**装起来**再验一遍
  # ============================================================
  # 这个 job 的存在理由是上面那个 job 验不到的一类问题：**只有在包外才暴露**。
  # 实例（曾经真实存在）：内置示例策略放在仓库根的 `strategies/` 下。
  # 在仓库根跑，cwd 会进 sys.path，于是那个顶层模块总能被找到 ——
  # `pip install .` 成功、`import signalchain` 成功、上面那个 job 全绿，
  # 而任何**装了包**的人一跑默认链路就是 `No module named 'strategies'`。
  # ⇒ 所以这里要两件事同时成立：装成包，且**不在仓库目录里**跑。
  installed:
    name: 装成包之后还能跑
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只在一个平台、一个版本上跑：这里验的是「包的形状对不对」，
      # 与操作系统和 Python 版本无关，铺成矩阵只是把同一件事跑六遍。
      - name: 装成包
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # ★ `cd` 出去是关键，不是随手加的。
      #   跑的是 README 里的**第一条命令** —— 于是这一步同时验了
      #   「装完包，照着 README 敲，真的能看到演示跑起来」。
      #   `--quiet` 只是让日志别刷屏；退出码由 run_demo 决定（失败非 0）。
      - name: 从仓库外的目录跑演示
        run: |
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          python -m signalchain.demo --quiet

  # ============================================================
  # 版本号一致性
  # ============================================================
  # 这一 job 防的是「版本号分叉」：`__version__` 与打包元数据各写一份、
  # CHANGELOG 写了版本标题但代码没升号、HEAD 在标签上但 CHANGELOG 没标题。
  # 三种都不会让程序崩，只会让「这一版到底改了什么」失去边界。
  #
  # ★ `fetch-depth: 0` 不能省：默认浅克隆看不到标签，`git describe --tags`
  #   会永远答「不在标签上」，这条检查就退化成**永远为真**。
  # ★ 本 job 只检查，**不自动打 tag、不自动发 Release** —— 发布是用户的动作。
  version:
    name: 版本一致性
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查版本单一来源与 tag / CHANGELOG 一致性
        run: python tools/check_version.py
