# signal-chain
#
# 打包配置刻意保持最小：这个项目的使用方式是「clone 下来直接跑」——
# 不再把 signal-chain 本身 pip install 成一个依赖，但它的**运行时依赖
# （requests + pandas）仍然要你自己装**：
#     py -m pip install requests pandas
# 所以没有 entry_points、没有 console_scripts。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-chain"
version = "0.1.0"
description = "策略与信号链路解耦的可插拔框架：策略只写 decide()，链路负责取数、闸门、投递、回执、对账"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 运行时依赖只有两个。这不是巧合，是设计约束：
#   - 行情走的是腾讯/新浪的公开 HTTP 接口（requests 足够），**不需要** akshare
#   - 数据处理只用 pandas
# akshare 体积大、依赖重、且接口常年变，只在「需要交易日历」时才是必需的 ——
# 所以它被放进可选依赖，而不是主依赖。
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
# ★ 别被「optional」骗了：**默认的实盘路径需要它**。
#   `build_chain()` 造的是 `TradingCalendar()`，而它默认走 akshare。
#   不装 akshare 时日历不可用 ⇒ **保守地把每一天都判成非交易日 ⇒ 一个任务都不跑**。
#   刻意不降级成「按工作日判断」：那会在法定节假日产生信号，比整天不动更危险
#   （见 signalchain/calendar.py 的「教训一」）。
#   真正零依赖的是 demo 那条路：`build_file_chain()` 自带离线日历，不需要 akshare。
calendar = ["akshare>=1.10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["signalchain*"]

[tool.pytest.ini_options]
# 让 `py -m pytest` 在仓库根直接跑得起来，不需要 pip install -e .
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
