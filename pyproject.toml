# signal-chain
#
# 打包配置刻意保持最小。两条用法都要成立：
#
#   1. **clone 下来直接跑**（推荐，也是 README 写的第一条路）——
#      运行时依赖 requests + pandas 自己装：`pip install requests pandas`
#   2. `pip install .` —— 有人就是这么用的，所以这条路**必须真的能跑**。
#
# ★ 第 2 条曾经是坏的，而且**在本机永远复现不出来**：内置示例策略当时放在
#   仓库根的 `strategies/` 下，从仓库根跑时 cwd 会进 sys.path，于是那个顶层
#   模块总能被找到 —— 而 `pip install .` 之后，走到默认策略的每一步都是
#   `ModuleNotFoundError: No module named 'strategies'`。
#   现在 CI 里有一个独立的 job 专门盯这条（装成包 → **从仓库外的目录**跑演示）。
#
# 所以没有 entry_points、没有 console_scripts。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-chain"
# ★ 版本号只有**一个**手写来源：`signalchain/__init__.py` 的 `__version__`。
#   这里不再写第二份 —— 两份版本号迟早会分叉，而分叉时的症状是
#   `pip show` 和人看到的代码对不上。`tools/check_version.py` 在 CI 里盯着这条。
dynamic = ["version"]
description = "策略与信号链路解耦的可插拔框架：策略只写 decide()，链路负责取数、闸门、投递、回执、对账"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 运行时依赖只有两个。这不是巧合，是设计约束：
#   - 行情走的是腾讯/新浪的公开 HTTP 接口（requests 足够），**不需要** akshare
#   - 数据处理只用 pandas
# akshare 体积大、依赖重、且接口常年变，只在「需要交易日历」时才是必需的 ——
# 所以它被放进可选依赖，而不是主依赖。
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
]

[project.optional-dependencies]
# ★ 别被「optional」骗了：**默认的实盘路径需要它**。
#   `build_chain()` 造的是 `TradingCalendar()`，而它默认走 akshare。
#   不装 akshare 时日历不可用 ⇒ **保守地把每一天都判成非交易日 ⇒ 一个任务都不跑**。
#   刻意不降级成「按工作日判断」：那会在法定节假日产生信号，比整天不动更危险
#   （见 signalchain/calendar.py 的「教训一」）。
#   真正零依赖的是 demo 那条路：`build_file_chain()` 自带离线日历，不需要 akshare。
calendar = ["akshare>=1.10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
# `signalchain*` 覆盖全部子包（marketdata / transport / strategies）。
# ★ `signalchain/strategies/` 必须在里面：`load_strategy("demo")` 是**默认值**，
#   缺了它装完包一跑就是 `No module named 'strategies'`。
#   默认值必须在包里 —— 见 signalchain/strategies/__init__.py。
include = ["signalchain*"]

[tool.pytest.ini_options]
# 让 `python -m pytest` 在仓库根直接跑得起来，不需要 pip install -e .
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.setuptools.dynamic]
# 从包里的字面量取版本。★ 不要让 `__version__` 运行时读 git：
# 装成 wheel 之后没有 `.git`，那会在用户机器上炸（而且只在别人机器上炸）。
version = { attr = "signalchain.__version__" }
